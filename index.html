<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8Dfyer: Turn any track into 8D audio</title>
  <meta name="description" content="Turn any audio or video file into 8D audio. Runs entirely in your browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand-group">
        <a href="#" class="brand"><span>8D</span>fyer</a>
        <span class="by">by <a href="https://github.com/bluqen" target="_blank" rel="noopener" class="by-link">bluqen</a></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Turn any track into 8D audio.</h1>
      <p class="lede">And let it spin!</p>
      <p class="headphones">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
        Headphones required
      </p>
    </section>

    <div id="errorBox" class="status error" role="alert" hidden></div>

    <section id="dropzone" class="dropzone" aria-label="Upload">
      <input id="file" type="file" accept=".mp3,.wav,.flac,.m4a,.mp4,.mov,.webm,audio/*,video/*" tabindex="-1" aria-hidden="true" class="visually-hidden">
      <div class="dz-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
      </div>
      <p id="dzTitle" class="dz-title">Drop an audio or video file here</p>
      <button id="chooseBtn" type="button" class="btn btn-primary">Choose file</button>
      <ul class="formats" aria-label="Supported formats">
        <li>mp3</li><li>wav</li><li>flac</li><li>m4a</li><li>mp4</li><li>mov</li><li>webm</li>
      </ul>
    </section>

    <section id="editor" class="editor" aria-label="Editor" hidden>
      <div class="ed-head">
        <div class="ed-title">
          <div class="ed-name-row">
            <h2 id="fileName"></h2>
            <span id="videoTag" class="tag-video" hidden>Video</span>
          </div>
          <p id="fileMeta" class="ed-meta"></p>
        </div>
        <button id="replaceBtn" type="button" class="btn btn-outline btn-sm">Replace file</button>
      </div>

      <div id="videoBox" class="ed-video" hidden>
        <div class="video-frame">
          <video id="video" playsinline muted aria-label="Video preview"></video>
          <span id="videoTime" class="video-time">0:00 / 0:00</span>
        </div>
      </div>

      <div class="ed-player">
        <div class="orbit-wrap">
          <svg id="orbit" data-orbit width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="Top-down view: sound orbiting the listener clockwise">
            <circle id="orbitRing" cx="56" cy="56" r="28.8" fill="none" stroke="#3d3e38" stroke-width="1"/>
            <circle cx="56" cy="56" r="9" fill="none" stroke="#b9b6a9" stroke-width="1.5"/>
            <path d="M53 47.5 L56 43.5 L59 47.5" fill="none" stroke="#b9b6a9" stroke-width="1.5" stroke-linejoin="round"/>
            <g id="orbitSpin" class="orbit-spin"><circle id="orbitDot" cx="56" cy="27.2" r="5" fill="#d8b25c"/></g>
          </svg>
        </div>
        <div class="player-main">
          <button id="playBtn" type="button" class="play-btn" aria-label="Play preview">
            <svg class="ico-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"/></svg>
            <svg class="ico-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
          </button>
          <div class="progress-col">
            <div id="progressTrack" class="progress" role="progressbar" aria-label="Preview position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressBar"></div></div>
            <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="ctl">
          <div class="ctl-head"><label for="period">Rotation speed</label><output id="periodOut" for="period">8 s per orbit</output></div>
          <input id="period" type="range" min="2" max="30" step="1" value="8">
        </div>
        <div class="ctl">
          <div class="ctl-head"><label for="radius">Distance</label><output id="radiusOut" for="radius">4</output></div>
          <input id="radius" type="range" min="1" max="8" step="1" value="4">
        </div>
        <div class="ctl">
          <div class="ctl-head"><label for="reverb">Reverb</label><output id="reverbOut" for="reverb">20%</output></div>
          <input id="reverb" type="range" min="0" max="100" step="1" value="20">
        </div>
        <div class="ctl">
          <label for="direction" class="ctl-label">Direction</label>
          <select id="direction">
            <option value="1">Clockwise</option>
            <option value="-1">Counter-clockwise</option>
          </select>
        </div>
        <label class="check">
          <input id="vertical" type="checkbox"> Slight vertical drift
        </label>
      </div>

      <div class="downloads">
        <button id="dlWav" type="button" class="btn btn-primary btn-grow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>Download WAV
        </button>
        <button id="dlMp3" type="button" class="btn btn-outline btn-grow">MP3</button>
        <button id="dlVideo" type="button" class="btn btn-outline btn-grow" hidden>MP4 with video</button>
      </div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
